# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "federated-learning-denoising-dentistry"
version = "1.0.0"
description = "Federated, local and centralized learning for dental panoramic radiograph denoising under data heterogeneity"
license = "Apache-2.0"
authors = [
    {name = "David Allerup"}
]
readme = "README.md"

# Note: remove 'source = "pytorch-cu118"' if using without CPU or on a M-series mac.
[tool.poetry.dependencies]
python = "~3.10"
flwr = {extras = ["simulation"], version = ">=1.20.0"}
flwr-datasets = {extras = ["vision"], version = ">=0.5.0"}
torch = {version = "2.7.1", source = "pytorch-cu118"}
torchvision = {version = "0.22.1", source = "pytorch-cu118"}
torchaudio = {version = "*", source = "pytorch-cu118"}
pillow = "^11.3.0"
scikit-learn = "^1.7.2"
wandb = "^0.21.4"
jupyterlab = "^4.4.9"
torchmetrics = "^1.8.2"
lpips = "^0.1.4"

[[tool.poetry.source]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
priority = "supplemental"

[tool.flwr.app]
publisher = "davidallerup"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "federated_learning_denoising_dentistry.server_app:app"
clientapp = "federated_learning_denoising_dentistry.client_app:app"

# Custom config values accessible via `context.run_config`.
# These are the settings used for the paper: the reported federated models are the
# global models after round 50, with 1 local epoch per client per round.
[tool.flwr.app.config]
num-server-rounds = 50
fraction-fit = 1     # All clients participate in every round
local-epochs = 1     # Local epochs per client per round
experiment = "case1" # case1, case2, case3a, case3b, case4; see EXPERIMENTS in federated_learning_denoising_dentistry/config.py

# One simulation federation per experiment; the number of SuperNodes equals the
# number of clients in that experiment. Run e.g.:
#   flwr run . case3a --run-config "experiment='case3a'"
[tool.flwr.federations]
default = "case1"

[tool.flwr.federations.case1]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 5
options.backend.client-resources.num-gpus = 1.0 # Train one client at a time by allocating a whole GPU

[tool.flwr.federations.case2]
options.num-supernodes = 6
options.backend.client-resources.num-cpus = 5
options.backend.client-resources.num-gpus = 1.0

[tool.flwr.federations.case3a]
options.num-supernodes = 11
options.backend.client-resources.num-cpus = 5
options.backend.client-resources.num-gpus = 1.0

[tool.flwr.federations.case3b]
options.num-supernodes = 11
options.backend.client-resources.num-cpus = 5
options.backend.client-resources.num-gpus = 1.0

[tool.flwr.federations.case4]
options.num-supernodes = 5
options.backend.client-resources.num-cpus = 5
options.backend.client-resources.num-gpus = 1.0
